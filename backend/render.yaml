services:
  - type: web
    name: tabsy-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://tabsy-coral.vercel.app
      - key: FRONTEND_URL
        value: https://tabsy-coral.vercel.app
      - key: API_BASE_URL
        value: https://tabsy-i1qo.onrender.com
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d